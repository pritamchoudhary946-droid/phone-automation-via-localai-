name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Only the newest run per branch matters; cancel superseded in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Belt-and-suspenders: all actions below already ship a Node 24 runtime, but this
# keeps any future Node 20 action from re-introducing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # --no-daemon keeps the run clean: the Gradle daemon's KSP/IntelliJ helper
      # thread can emit a harmless "ApplicationManager.getApplication() is null"
      # warning after the build; no daemon means it exits instead of lingering.
      - name: Run Debug Unit Tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Debug Lint
        run: bash ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          bash ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not generated!"
            exit 1
          fi
          echo "APK successfully found at app/build/outputs/apk/debug/app-debug.apk"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: OmniAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
