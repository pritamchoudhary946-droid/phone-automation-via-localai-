name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Only the newest run per branch matters; cancel superseded in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Belt-and-suspenders: all actions below already ship a Node 24 runtime, but this
# keeps any future Node 20 action from re-introducing the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config loaded from GitHub Actions secret."
          else
            echo "GOOGLE_SERVICES_JSON is not set; Google sign-in will show setup guidance."
          fi

      - name: Configure stable debug signing key (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "Stable debug keystore loaded."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set. GitHub may generate a different debug SHA-1 on each clean runner."
          fi

      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            if ! jq -e 'any(.client[]?; .client_info.android_client_info.package_name == "com.aistudio.omniagent.kjqvlm" and any(.oauth_client[]?; .client_type == 3))' app/google-services.json >/dev/null; then
              echo "::error::GOOGLE_SERVICES_JSON must match package com.aistudio.omniagent.kjqvlm and contain a Web OAuth client (client_type 3)."
              exit 1
            fi
            echo "Validated Firebase config for this app."
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set; Google sign-in will show setup guidance."
          fi

      # --no-daemon keeps the run clean: the Gradle daemon's KSP/IntelliJ helper
      # thread can emit a harmless "ApplicationManager.getApplication() is null"
      # warning after the build; no daemon means it exits instead of lingering.
      - name: Run Debug Unit Tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Debug Lint
        run: bash ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          bash ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not generated!"
            exit 1
          fi
          echo "APK successfully found at app/build/outputs/apk/debug/app-debug.apk"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Report APK signing certificate (for Firebase SHA-1 setup)
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: OmniAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
